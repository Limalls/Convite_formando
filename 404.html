<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecionando…</title>
    <script>
  
      var basePath = "/Convite_formando/";
      var fullPath = location.pathname;
      var relativePath = fullPath.startsWith(basePath)
        ? fullPath.slice(basePath.length)
        : fullPath.replace(/^\//, "");
      var query = location.search
        ? location.search.replace("?", "") + "&"
        : "";
      location.replace(
        basePath +
          "?" +
          query +
          "redirect=" +
          encodeURIComponent(relativePath) +
          location.hash
      );
    </script>
  </head>
  <body></body>
</html>
